name: evalgate

on:
  pull_request:
    paths:
      - "src/**"
      - "evals/**"
      - "goldens/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

concurrency:
  group: evalgate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      EVAL_SAMPLE: "4"   

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch first (keeps the install small), then the rest
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-ms-marco

      - name: Fast offline tests
        run: pytest -q

      - name: Check the PDF is in the repo
        run: test -f data/apple_2024_report.pdf || (echo "Commit data/apple_2024_report.pdf (or add a download step)" && exit 1)

      - name: Run evals (sampled)
        run: |
          python -m evals.eval_retriever $EVAL_SAMPLE
          python -m evals.eval_generator $EVAL_SAMPLE
          python -m evals.eval_pipeline $EVAL_SAMPLE

      - name: Gate
        run: python -m evals.gate

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
